<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Risk Panel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        h3 {
            font-size: 13px;
            margin: 0 0 2px 0;
            color: #888;
            text-align: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        button:active { opacity: 0.7; }
        .btn-be { background-color: #2196F3; color: white; }
        .btn-partial { background-color: #FF9800; color: white; }
        .btn-close { background-color: #f44336; color: white; }
    </style>
</head>
<body>

    <h3>Risk Control Panel</h3>
    <div class="btn-container">
        <button class="btn-be" onclick="sendAction('breakeven')">Break Even (BE)</button>
        <button class="btn-partial" onclick="sendAction('partial_close')">Partial Close (50%)</button>
        <button class="btn-close" onclick="sendAction('close_all')">Close All Positions</button>
    </div>

    <script>
        function sendAction(actionType) {
            // Sends message to the cTrader WebView container wrapper
            if (window.parent) {
                window.parent.postMessage(actionType, "*");
            }
        }
    </script>
</body>
</html>
