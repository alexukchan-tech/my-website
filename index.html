<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Trade Panel</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: sans-serif;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-be { background-color: #0088ff; color: white; }
        .btn-partial { background-color: #ffa500; color: white; }
        .btn-close { background-color: #ff0000; color: white; }
    </style>
</head>
<body>

    <h3>Risk Control Panel</h3>
    <button class="btn-be" onclick="sendAction('breakeven')">Break Even (BE)</button>
    <button class="btn-partial" onclick="sendAction('partial_close')">Partial Close (50%)</button>
    <button class="btn-close" onclick="sendAction('close_all')">Close All Positions</button>

    <script>
        function sendAction(action) {
            // This sends the button click signal to cTrader's WebView container
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(action);
            } else {
                console.log("Action triggered: " + action);
            }
        }
    </script>
</body>
</html>
